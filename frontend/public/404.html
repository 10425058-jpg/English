<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Quest — Redirecting</title>
    <script>
      (function () {
        var repoBase = '/English';
        var path = window.location.pathname;
        var relative = path.indexOf(repoBase) === 0 ? path.slice(repoBase.length) : path;
        if (!relative || relative === '/') relative = '/learn';
        window.location.replace(repoBase + '/#' + relative + window.location.search);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to English Quest...</p>
  </body>
</html>
