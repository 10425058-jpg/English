name: English Quest CI/CD

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Typecheck, Lint, Unit Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck monorepo
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build production bundle for GitHub Pages
        env:
          VITE_BASE_PATH: /English/
        run: npm run build

      - name: Install Playwright Chromium for smoke test
        run: npx --workspace=frontend playwright install chromium

      - name: Run Playwright E2E smoke tests
        run: npm run test:e2e

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy_pages:
    name: Deploy Frontend to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
